name: 'build'

on:
  workflow_dispatch:
  push:
    branches:
      - release

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'npm'

      - run: npm ci
      - run: npm run lint
      - run: npm test

  publish-tauri:
    needs: check
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          #          - platform: 'macos-latest' # for Arm based macs (M1 and above).
          #            args: '--target aarch64-apple-darwin'
          #          - platform: 'macos-latest' # for Intel based macs.
          #            args: '--target x86_64-apple-darwin'
          - platform: 'ubuntu-24.04'
            args: ''
          - platform: 'ubuntu-24.04-arm' # Only available in public repos.
            args: ''
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-24.04'  || matrix.platform == 'ubuntu-24.04-arm' # This must match the platform value defined above.
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'npm' # Set this to npm, yarn or pnpm.

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable # Set this to dtolnay/rust-toolchain@nightly
        with:
          # Those targets are only used on macos runners so it's in an `if` to slightly speed up the linux builds.
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: install frontend dependencies
        run: npm ci

      # The frontend is built by tauri-action via `beforeBuildCommand` in
      # tauri.conf.json; building it here too would just do the work twice.
      - uses: tauri-apps/tauri-action@v0.6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: app-v__VERSION__ # the action automatically replaces \_\_VERSION\_\_ with the app version.
          releaseName: 'App v__VERSION__'
          releaseId: __RELEASE_ID__
          releaseBody: 'See the assets to download this version and install.'
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

  build-aur:
    needs: publish-tauri
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Get app version
        id: version
        # package.json is the single source of truth; tauri.conf.json reads its
        # version from there, so the release tag always matches.
        run: echo "VERSION=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: Download release artifacts and compute checksums
        id: checksum
        run: |
          VERSION=${{ steps.version.outputs.VERSION }}
          BASE="https://github.com/${{ github.repository }}/releases/download/app-v${VERSION}"
          wget -q "${BASE}/ProjectTracker_${VERSION}_amd64.deb" -O amd64.deb
          wget -q "${BASE}/ProjectTracker_${VERSION}_arm64.deb" -O arm64.deb
          echo "SHA256_X86_64=$(sha256sum amd64.deb | cut -d' ' -f1)" >> $GITHUB_OUTPUT
          echo "SHA256_AARCH64=$(sha256sum arm64.deb | cut -d' ' -f1)" >> $GITHUB_OUTPUT

      - name: Update PKGBUILD
        # Replaces the whole line rather than matching a placeholder, so this
        # keeps working no matter what value is currently committed.
        run: |
          cd aur
          sed -i "s|^pkgver=.*|pkgver=${{ steps.version.outputs.VERSION }}|" PKGBUILD
          sed -i "s|^sha256sums_x86_64=.*|sha256sums_x86_64=('${{ steps.checksum.outputs.SHA256_X86_64 }}')|" PKGBUILD
          sed -i "s|^sha256sums_aarch64=.*|sha256sums_aarch64=('${{ steps.checksum.outputs.SHA256_AARCH64 }}')|" PKGBUILD

      - name: Build AUR package
        run: |
          docker run --rm \
            -v "$PWD/aur:/build" \
            -w /build \
            archlinux:latest \
            bash -c "
              set -e
              pacman -Syu --noconfirm base-devel &&
              useradd -m builduser &&
              chown -R builduser /build &&
              su builduser -c 'makepkg --noconfirm --noprogressbar --nodeps --printsrcinfo > .SRCINFO' &&
              su builduser -c 'makepkg --noconfirm --noprogressbar --nodeps'
            "

      - name: Upload AUR package to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=${{ steps.version.outputs.VERSION }}
          PKG=$(ls aur/*.pkg.tar.zst | head -1)
          gh release upload "app-v${VERSION}" "${PKG}" --clobber

      - name: Upload updated PKGBUILD
        # PKGBUILD and .SRCINFO as published; download these to push to the AUR.
        uses: actions/upload-artifact@v4
        with:
          name: aur-pkgbuild
          path: |
            aur/PKGBUILD
            aur/.SRCINFO
