[package]
name = "projecttracker"
# Not the released version: tauri.conf.json takes that from package.json, which
# is the single source of truth for the bundle, the release tag and the PKGBUILD.
version = "0.0.0"
description = "Project tracker application"
authors = ["sam <sampyeatt4@proton.me>"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "projecttracker_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# Defaults tuned for a small desktop binary rather than for compile speed. The
# untuned build was 18MB, of which 2MB was unwind tables and the rest unstripped
# symbols and duplicated code across 16 codegen units.
#
# `panic = "abort"` is the one line here that changes behaviour: a panic now
# terminates the process instead of unwinding. Nothing in this app catches a
# panic, but drop this line if that ever changes.
[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true

[build-dependencies]
tauri-build = { version = "^2", features = [] }

[dependencies]
tauri = { version = "^2.11.3", features = [] }
tauri-plugin-opener = "^2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-sql = { version = "^2.4.0", features = ["sqlite"] }

